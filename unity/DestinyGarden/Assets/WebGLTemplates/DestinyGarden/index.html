<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #03080b; }
      /* The game UI is laid out for 16:9 (CanvasScaler 1600x900), so the canvas is
         letterboxed to 16:9 inside whatever frame itch.io or the browser gives it. */
      #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #03080b; outline: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; color: #e3dec9; font: 15px Georgia, serif; letter-spacing: 0.08em; }
      #bar { width: 240px; height: 3px; background: rgba(227, 222, 201, 0.18); }
      #bar-fill { width: 0; height: 100%; background: #c9862a; transition: width 0.2s; }
      /* Phones held upright: the 16:9 garden is small, so a quiet hint to turn the phone (touch screens only). */
      #turn { display: none; position: absolute; left: 0; right: 0; top: calc(14px + env(safe-area-inset-top, 0px));
        text-align: center; color: #e3dec9; opacity: 0.72; font: 13px Georgia, "Hiragino Mincho ProN", serif;
        letter-spacing: 0.08em; pointer-events: none; }
      @media (orientation: portrait) and (pointer: coarse) { #turn { display: block; } }
      #error { display: none; position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 10px 12px;
        background: #6b1d1d; color: #fff; font: 14px sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas></div>
    <div id="loading"><div>Destiny Garden</div><div id="bar"><div id="bar-fill"></div></div></div>
    <div id="turn">横向きにすると、庭が大きく見えます</div>
    <div id="error"></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        if (w / h > 16 / 9) w = Math.floor(h * 16 / 9); else h = Math.floor(w * 9 / 16);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      window.addEventListener("resize", fit);
      fit();

      function showError(msg) {
        var el = document.querySelector("#error");
        el.textContent = msg;
        el.style.display = "block";
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // The garden journal lives in persistentDataPath; persist it to IndexedDB on every write.
        autoSyncPersistentDataPath: true,
        // Cap the render scale so high-DPI screens stay smooth with post-processing. Phones show the garden on a
        // small CSS size, so they get up to 2x (about the pixel count of a 1280x720 desktop) to stay sharp.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, isPhone ? 2 : 1.5),
        showBanner: function (msg, type) { if (type === "error") showError(msg); },
      }, function (progress) {
        document.querySelector("#bar-fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
      }).catch(function (message) {
        showError(String(message));
      });
    </script>
  </body>
</html>
