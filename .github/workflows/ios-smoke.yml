name: iOS native smoke

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Gemfile'
      - 'fastlane/**'
      - '.github/workflows/ios-smoke.yml'
  push:
    branches:
      - main
      - 'p11-*'
    paths:
      - 'ios/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Gemfile'
      - 'fastlane/**'
      - '.github/workflows/ios-smoke.yml'

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Require Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]}')"
          test "$major" -ge 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web and sync native project
        run: |
          pnpm build
          npx cap sync ios

      - name: Validate fastlane lanes
        run: bundle exec fastlane lanes

      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
