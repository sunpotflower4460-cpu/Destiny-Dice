name: CI

on:
  push:
    branches:
      - main
      - 'gate0-*'
      - 'p[0-9]*'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck public anchor Worker
        run: pnpm worker:typecheck

      - name: Test
        run: pnpm test

      - name: Simulate null year and verify report golden
        shell: bash
        run: |
          set -euo pipefail
          pnpm simulate --days 365 --effect 0 --wish-n 120 --wish-base 0.3 --wish-effect 0 \
            --export /tmp/experiment.json --report /tmp/sim-report.md | tee /tmp/null-sim.json
          grep -F '"reportSha256": "1ec5f22034d18546ac20e2b8c64b5ea1dcab5e7faf4e903e7e7c58182f398381"' /tmp/null-sim.json

      - name: Verify export and reproduce report
        shell: bash
        run: |
          set -euo pipefail
          pnpm verify-export /tmp/experiment.json
          pnpm generate-report /tmp/experiment.json /tmp/rebuilt-report.md
          cmp /tmp/sim-report.md /tmp/rebuilt-report.md

      - name: Simulate Layer A positive fixture
        run: pnpm simulate --days 365 --effect 0.01 --condition 2 --wish-n 120 --wish-base 0.3 --wish-effect 0

      - name: Simulate Layer C positive fixture
        run: pnpm simulate --days 365 --effect 0 --wish-n 120 --wish-base 0.3 --wish-effect 0.25

      - name: Release readiness checks
        run: pnpm release-check

      - name: Build
        run: pnpm build

      - name: Guard append-only ledger
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE \
            --include='*.ts' --include='*.tsx' \
            'DELETE[[:space:]]+FROM[[:space:]]+ledger|UPDATE[[:space:]]+ledger|ledger.*\.(delete|remove)\(' \
            src scripts; then
            echo 'Forbidden ledger mutation code detected.' >&2
            exit 1
          fi
          echo 'OK: no forbidden ledger DELETE/UPDATE paths found.'
