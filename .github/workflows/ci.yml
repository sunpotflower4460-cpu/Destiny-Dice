name: CI

on:
  push:
    branches:
      - main
      - 'gate0-*'
      - 'p[0-9]*'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Simulate offline P4 flow
        run: pnpm simulate

      - name: Build
        run: pnpm build

      - name: Guard append-only ledger
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE \
            --include='*.ts' --include='*.tsx' \
            'DELETE[[:space:]]+FROM[[:space:]]+ledger|UPDATE[[:space:]]+ledger|ledger.*\.(delete|remove)\(' \
            src scripts; then
            echo 'Forbidden ledger mutation code detected.' >&2
            exit 1
          fi
          echo 'OK: no forbidden ledger DELETE/UPDATE paths found.'
