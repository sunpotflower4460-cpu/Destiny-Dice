name: P11 finalize progress once

on:
  push:
    branches:
      - p11-release-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p11-release-hardening
      - name: Record P11 evidence and self-delete
        shell: bash
        run: >-
          echo '' | base64 -d >> PROGRESS.md && git rm .github/workflows/p11-finalize-progress-once.yml && git add PROGRESS.md && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git commit -m 'P11: record final release evidence' && git push origin HEAD:p11-release-hardening
