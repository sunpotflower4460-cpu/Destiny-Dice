## P11: Public Anchoring / Release Hardening (2026-08-28)

### 完了したこと
- production bundle identifierを `com.sunpotflower4460.intentiondice` に確定し、Capacitor設定とiOS Xcode projectの識別子を一致させた。
- App Store提出用の1024x1024 RGB / no-alpha App Iconとsplash assetsへ置換した。
- `ITSAppUsesNonExemptEncryption = false` をiOS Info.plistへ固定し、独自の非免除暗号を提供しない現在の実装境界を提出設定へ反映した。
- Fastlane / GitHub Actionsによる手動TestFlight release経路を追加し、Xcode 26+をrelease gateとして固定した。
- 通常PR向けに `macos-26` / Xcode 26+ のiOS native smokeを追加し、Web build -> Capacitor sync -> Simulator runtime -> `App.xcworkspace` iOS Simulator buildを署名なしで検証するようにした。
- App Store向け日本語metadata、privacy文書、submission checklist、release checkを追加した。
- optionalな週次public anchoringを実装した。外部へ送るのは `genesisHash / headHash / headSeq / protocolVersion` のみで、wish本文、mood、prediction、raw RNG bits、registration payload等は送らない。
- anchoring失敗・endpoint未設定・オフラインは実験、RNG取得、ledger append、UIを停止させない。ローカルchainの意味は引き続き **tamper-evident** であり、tamper-proofとは表現しない。
- Cloudflare Workerに `POST /anchors` / `GET /anchors/<genesisHash>`、server-side `receivedAt`、duplicate idempotency、strict request key validationを実装した。余分な本文フィールド等を含むrequestは拒否する。
- Worker strict typecheck / unit testsと手動deploy workflowを追加した。
- `pnpm release-check` を追加し、仮bundle ID残存、危険なstore表現、App Iconのsize/alpha、Xcode 26 gate、Worker公開GET等を機械検証するようにした。
- 外部資格情報のready/missingだけを確認する一時workflowを1回実行し、値を表示せず状態だけ確認した後、そのworkflow自体を自動削除した。

