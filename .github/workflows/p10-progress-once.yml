name: P10 progress append once

on:
  push:
    branches:
      - p10-final-report

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p10-final-report
      - name: Append P10 completion and remove helper
        shell: bash
        env:
          P10_PROGRESS_B64: 
        run: |
          set -euo pipefail
          if ! grep -q '^## P10: Final Report' PROGRESS.md; then
            printf '%s' "$P10_PROGRESS_B64" | base64 -d >> PROGRESS.md
          fi
          git rm .github/workflows/p10-progress-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROGRESS.md
          git commit -m "P10: record final report completion"
          git push origin HEAD:p10-final-report
