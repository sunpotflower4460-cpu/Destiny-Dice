name: P10 progress append once

on:
  push:
    branches:
      - p10-final-report

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p10-final-report
      - name: Append P10 completion and remove helper
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## P10: Final Report' PROGRESS.md; then
            cat >> PROGRESS.md <<'EOF'

---

