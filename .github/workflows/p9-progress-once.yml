name: P9 progress append once

on:
  push:
    branches:
      - p9-notifications-continuity-ux

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p9-notifications-continuity-ux
      - name: Append P9 completion
        shell: bash
        env:
          P9_PROGRESS_B64: 
        run: |
          set -euo pipefail
          if grep -q '^## P9: Notifications / Continuity UX' PROGRESS.md; then
            exit 0
          fi
          printf '%s' "$P9_PROGRESS_B64" | base64 -d >> PROGRESS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROGRESS.md
          git commit -m "P9 record notifications and continuity completion"
          git push origin HEAD:p9-notifications-continuity-ux
