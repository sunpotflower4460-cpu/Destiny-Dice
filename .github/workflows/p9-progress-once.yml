### Native/UI確認の制約
- CI実行環境はUbuntuのため、Xcode/iOS simulator上での実通知deliveryはこのフェーズ内では直接実行できない。Capacitor v6 dependency、TypeScript adapter、iOS Pod wiring、production web build、および通知planner/permission境界はCIで検証済み。
- iOS実機/Simulatorで「permission prompt → 日次通知 → 締切通知」のdelivery smoke checkはrelease環境で実施する。これは科学プロトコル/アプリロジックの未実装ではなくnative release smoke checkとして扱う。

