name: P11 external release readiness once

on:
  push:
    branches:
      - p11-release-hardening

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p11-release-hardening
      - name: Report readiness without exposing values
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV: ${{ secrets.CLOUDFLARE_ANCHOR_KV_NAMESPACE_ID }}
          ANU_ENDPOINT: ${{ vars.VITE_ANU_RNG_ENDPOINT }}
          NOTARY_ENDPOINT: ${{ vars.VITE_NOTARY_ENDPOINT }}
        run: |
          apple=ready
          for value in "$APPLE_TEAM_ID" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$ASC_KEY_CONTENT"; do
            [ -n "$value" ] || apple=missing
          done
          cloudflare=ready
          for value in "$CF_TOKEN" "$CF_ACCOUNT" "$CF_KV"; do
            [ -n "$value" ] || cloudflare=missing
          done
          [ -n "$ANU_ENDPOINT" ] && anu=ready || anu=missing
          [ -n "$NOTARY_ENDPOINT" ] && notary=ready || notary=missing
          echo "APPLE_RELEASE_SECRETS=$apple"
          echo "CLOUDFLARE_RELEASE_SECRETS=$cloudflare"
          echo "VITE_ANU_RNG_ENDPOINT=$anu"
          echo "VITE_NOTARY_ENDPOINT=$notary"
      - name: Remove readiness helper
        shell: bash
        run: |
          git rm .github/workflows/p11-secret-readiness-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'P11: remove external readiness helper'
          git push origin HEAD:p11-release-hardening
