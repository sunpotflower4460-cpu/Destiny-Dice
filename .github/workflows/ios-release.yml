name: iOS TestFlight release

# Signing/upload is never run on ordinary pushes or pull requests.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Require Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]}')"
          test "$major" -ge 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload internal TestFlight build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          VITE_ANU_RNG_ENDPOINT: ${{ vars.VITE_ANU_RNG_ENDPOINT }}
          VITE_NOTARY_ENDPOINT: ${{ vars.VITE_NOTARY_ENDPOINT }}
        run: bundle exec fastlane ios beta

      - name: Upload fastlane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs
          path: |
            ~/Library/Logs/gym
            fastlane/report.xml
          if-no-files-found: ignore
          retention-days: 14
