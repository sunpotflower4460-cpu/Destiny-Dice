import type { WishClock } from './types';

const registrationInput: RegistrationInput = {
  experimentId: 'p11-wish-boundary',
  startDate: '2026-09-01',
  bitsPerDraw: 1024,
  sessionsPerDay: 1,
  dayBoundaryHour: 3,
  affirmationText: '私は落ち着いて今日の意図に向き合う',
  predictionByCondition: ['p1', 'p2', 'p3', 'p4', 'p5'],
  timeZone: 'Asia/Tokyo',
  scheduleSeed: 'p11-wish-boundary-schedule',
  targetSeed: 'p11-wish-boundary-target',
  layerC: { enabled: true, defaultDeadlineDays: 28, notarize: false },
};

class TickClock implements WishClock {
  private tick = 0;
  constructor(private readonly base: string) {}
  now(): string {
    const value = new Date(Date.parse(this.base) + this.tick * 1000).toISOString();
    this.tick += 1;
    return value;
  }
}

class CountingRng {
  calls = 0;
  async getAssignmentBit(): Promise<AssignmentBit> {
    this.calls += 1;
    return { bit: 1, source: 'local' };
  }
}

async function setup(clockBase: string) {
  const ledger = new LedgerService(new MemoryLedgerStore());
  await new RegistrationService(ledger).register(registrationInput, '2026-08-28T00:00:00.000Z');
  const rng = new CountingRng();
  let id = 0;
  const service = new WishRegistryService(ledger, rng, new TickClock(clockBase), () => `boundary-${++id}`);
  return { ledger, rng, service };
}

describe('P11 deep audit: wish registration boundaries', () => {
  it('accepts only the frozen 14/28/90-day deadline choices during the experiment', async () => {
    const { service, rng } = await setup('2026-09-01T00:00:00.000Z');
    for (const deadline of ['2026-09-15', '2026-09-29', '2026-11-30']) {
      await service.registerWish({ text: `deadline ${deadline}`, deadline, likelihood: 2, influence: 'mixed' });
    }
    expect(rng.calls).toBe(3);
  });

