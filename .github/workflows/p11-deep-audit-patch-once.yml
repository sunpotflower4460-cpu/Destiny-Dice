import { MemoryLedgerStore } from '../ledger/memoryStore';
import { LedgerService } from '../ledger/service';
import { RegistrationService } from '../registration/service';
import type { RegistrationInput } from '../registration/types';
import type { RandomBits } from '../rng/types';
import { SessionFlowService } from './service';
import type { Clock, SessionDraft } from './types';

const registrationInput: RegistrationInput = {
  experimentId: 'p11-session-race',
  startDate: '2026-09-01',
  bitsPerDraw: 1024,
  sessionsPerDay: 1,
  dayBoundaryHour: 3,
  affirmationText: '私は落ち着いて今日の的に意図を向ける',
  predictionByCondition: ['p1', 'p2', 'p3', 'p4', 'p5'],
  timeZone: 'Asia/Tokyo',
  scheduleSeed: 'p11-session-race-schedule',
  targetSeed: 'p11-session-race-target',
  layerC: { enabled: true, defaultDeadlineDays: 28, notarize: false },
};

class QueueClock implements Clock {
  constructor(private readonly values: string[]) {}
  now(): string {
    const value = this.values.shift();
    if (!value) throw new Error('clock exhausted');
    return value;
  }
}

function draw(hexByte: string): RandomBits {
  return { bitsHex: hexByte.repeat(128), nBits: 1024, source: 'local' };
}

function draft(): SessionDraft {
  return {
    experimentDate: '2026-09-01',
    seqInDay: 1,
    moodPre: { v: 5, e: 5 },
    ritual: { seconds: 600, text: '今日の的が実現した状態を具体的に思い描いて十分な長さで記録する文章です。' },
    moodPost: { v: 6, e: 6 },
    confidence: 50,
    context: { hour: 10, dow: 2, lunarPhase: 0.4 },
    startedAt: '2026-09-01T01:00:00.000Z',
  };
}

describe('P11 deep audit: measured-session concurrency', () => {
  it('serializes concurrent attempts for the same slot so only one prediction/session and one measured draw commit', async () => {
    const ledger = new LedgerService(new MemoryLedgerStore());
    await new RegistrationService(ledger).register(registrationInput, '2026-08-28T00:00:00.000Z');

    let releaseMeasured!: () => void;
    let markMeasuredStarted!: () => void;
    const measuredStarted = new Promise<void>((resolve) => { markMeasuredStarted = resolve; });
    let calls = 0;
    const rng = {
      getBits: async (): Promise<RandomBits> => {
        calls += 1;
        if (calls === 1) return draw('aa');
        if (calls === 2) {
          markMeasuredStarted();
          await new Promise<void>((resolve) => { releaseMeasured = resolve; });
          return draw('ff');
        }
        throw new Error('unexpected extra RNG acquisition');
      },
    };
    const service = new SessionFlowService(
      ledger,
      rng,
      new QueueClock([
        '2026-09-01T00:00:00.000Z',
        '2026-09-01T01:10:00.000Z',
        '2026-09-01T01:10:01.000Z',
      ]),
    );
    await service.prepareSession('2026-09-01', 1);

    const first = service.runSession(draft());
    await measuredStarted;
    const second = service.runSession(draft());
    await Promise.resolve();
    expect(calls).toBe(2);
    releaseMeasured();

    const outcomes = await Promise.allSettled([first, second]);
    expect(outcomes.filter((item) => item.status === 'fulfilled')).toHaveLength(1);
    expect(outcomes.filter((item) => item.status === 'rejected')).toHaveLength(1);
    if (outcomes[1]?.status === 'rejected') {
      expect(String(outcomes[1].reason)).toContain('already committed');
    }
    const entries = await ledger.list();
    expect(entries.filter((entry) => entry.type === 'prediction')).toHaveLength(1);
    expect(entries.filter((entry) => entry.type === 'session')).toHaveLength(1);
    expect(calls).toBe(2);
  });
});
''')

