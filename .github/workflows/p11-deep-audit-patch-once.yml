name: P11 deep integrity audit patch once

on:
  push:
    branches:
      - p11-deep-integrity-audit-hotfix

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'P11: stage deep integrity audit patch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p11-deep-integrity-audit-hotfix
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply narrowly-scoped integrity fixes
        shell: bash
