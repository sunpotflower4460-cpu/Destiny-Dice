          Path('src/continuity/wishMomentRecovery.audit.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
import type { StoredLedgerEntry } from '../ledger/types';
import { derivePendingWishMoment } from './runtime';

function entry(seq: number, type: StoredLedgerEntry['type'], payload: object): StoredLedgerEntry {
  return {
    seq,
    type,
    payloadJson: JSON.stringify(payload),
    createdAt: '2026-09-01T00:00:00.000Z',
    prevHash: '0'.repeat(64),
    entryHash: String(seq).padStart(64, '0'),
  };
}

function practiceWishEntries(): StoredLedgerEntry[] {
  return [
    entry(1, 'wish', {
      wishId: 'practice-1',
      text: '再開時にも表示される実践願い',
      deadline: '2026-09-29',
      likelihood: 2,
      influence: 'mixed',
      createdAt: '2026-09-01T00:00:00.000Z',
    }),
    entry(2, 'assignment', {
      wishId: 'practice-1',
      arm: 'practice',
      rngSource: 'local',
      bit: 1,
      committedAt: '2026-09-01T00:00:01.000Z',
    }),
  ];
}

describe('P11 deep audit: wish-moment crash recovery projection', () => {
  it('requires wish-moment recovery when a session committed but no later wishmoment exists', () => {
    const entries = [...practiceWishEntries(), entry(3, 'session', { date: '2026-09-01', seqInDay: 1 })];
    const pending = derivePendingWishMoment(entries, '2026-09-01');
    expect(pending?.wishes.map((wish) => wish.wishId)).toEqual(['practice-1']);
  });

  it('closes recovery once a wishmoment for that date is appended after the latest session', () => {
    const entries = [
      ...practiceWishEntries(),
      entry(3, 'session', { date: '2026-09-01', seqInDay: 1 }),
      entry(4, 'wishmoment', { date: '2026-09-01', wishIdsShown: ['practice-1'], seconds: 30 }),
    ];
    expect(derivePendingWishMoment(entries, '2026-09-01')).toBeNull();
  });

  it('requires a new wishmoment after a later session even if an earlier session had one', () => {
    const entries = [
      ...practiceWishEntries(),
      entry(3, 'session', { date: '2026-09-01', seqInDay: 1 }),
      entry(4, 'wishmoment', { date: '2026-09-01', wishIdsShown: ['practice-1'], seconds: 30 }),
      entry(5, 'session', { date: '2026-09-01', seqInDay: 2 }),
    ];
    expect(derivePendingWishMoment(entries, '2026-09-01')?.wishes).toHaveLength(1);
  });

  it('does not invent a wishmoment when no practice wish is eligible', () => {
    const entries = [
      entry(1, 'wish', {
        wishId: 'sealed-1',
        text: '封印本文',
        deadline: '2026-09-29',
        likelihood: 2,
        influence: 'mixed',
        createdAt: '2026-09-01T00:00:00.000Z',
      }),
      entry(2, 'assignment', {
        wishId: 'sealed-1',
        arm: 'sealed',
        rngSource: 'local',
        bit: 0,
        committedAt: '2026-09-01T00:00:01.000Z',
      }),
      entry(3, 'session', { date: '2026-09-01', seqInDay: 1 }),
    ];
    expect(derivePendingWishMoment(entries, '2026-09-01')).toBeNull();
  });
});
''')

