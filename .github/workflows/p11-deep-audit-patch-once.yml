/**
 * A measured session is already immutable before the Layer C wish moment runs.
 * If the app is interrupted in that gap, resume the wish moment before allowing
 * another session. A later wishmoment for the same experiment date closes the
 * latest committed session. Zero eligible practice wishes require no record.
 */
export function derivePendingWishMoment(
  entries: readonly StoredLedgerEntry[],
  experimentDate: string,
): WishMomentProjection | null {
  let latestSessionSeq: number | null = null;
  for (const entry of entries) {
    const identity = sessionIdentity(entry);
    if (identity?.date !== experimentDate) continue;
    if (latestSessionSeq === null || entry.seq > latestSessionSeq) latestSessionSeq = entry.seq;
  }
  if (latestSessionSeq === null) return null;

  const closed = entries.some((entry) => (
    entry.seq > latestSessionSeq! && wishMomentDate(entry) === experimentDate
  ));
  if (closed) return null;

  const projection = projectWishMoment(entries, experimentDate);
  return projection.wishes.length > 0 ? projection : null;
}

