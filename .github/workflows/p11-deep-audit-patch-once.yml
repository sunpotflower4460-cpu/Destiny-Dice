  startDate: '2026-09-01',
  bitsPerDraw: 1024,
  sessionsPerDay: 1,
  dayBoundaryHour: 3,
  affirmationText: '私は落ち着いて今日の的に意図を向ける',
  predictionByCondition: ['p1', 'p2', 'p3', 'p4', 'p5'],
  timeZone: 'Asia/Tokyo',
  scheduleSeed: 'p11-final-gate-schedule',
  targetSeed: 'p11-final-gate-target',
  layerC: { enabled: true, defaultDeadlineDays: 28, notarize: false },
};

describe('P11 deep audit: final-report no-peeking gate', () => {
  it('blocks through the last frozen experiment date and opens on the next experiment date', async () => {
    const ledger = new LedgerService(new MemoryLedgerStore());
    const registered = await new RegistrationService(ledger).register(registrationInput, '2026-08-28T00:00:00.000Z');
    expect(() => assertFinalReportAvailable(registered.payload, '2027-08-31')).toThrow('unavailable until after 2027-08-31');
    expect(() => assertFinalReportAvailable(registered.payload, '2027-09-01')).not.toThrow();
  });

  it('uses the frozen timezone/day boundary when the official now-based path decides availability', async () => {
